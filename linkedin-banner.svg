      </text>

      <text x="0" y="234">
        <tspan fill="#C084FC">await</tspan> <tspan fill="#60A5FA">deployToProduction</tspan><tspan fill="#94A3B8">(</tspan><tspan fill="#E2E8F0">developer</tspan><tspan fill="#94A3B8">);</tspan>
